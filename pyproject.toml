[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-project-manager"
version = "0.1.0"
description = "Tableau de développement Django et coordination des agents IA, en français"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Django>=5.2,<6.2"]
classifiers = ["Framework :: Django", "Programming Language :: Python :: 3", "Natural Language :: French"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["build>=1.2", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["django_project_manager*"]

[tool.setuptools.package-data]
django_project_manager = ["templates/**/*.html", "static/**/*", "schemas/*.json"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
